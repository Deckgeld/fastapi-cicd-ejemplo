name: CD - Build y Deploy a AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Necesario para OIDC
  contents: read    # Necesario para actions/checkout

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  # -------------------------------------------------------
  # JOB 1: Construir la imagen Docker y subirla a ECR
  # -------------------------------------------------------
  build-and-push:
    name: Build y Push a ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Instalar dependencias y validar la aplicación
        run: |
          pip install -r requirements-dev.txt
          ruff check ./app ./tests
          pytest tests/ -v --tb=short

      # Autenticarse en AWS usando OIDC (sin Access Keys estáticas)
      - name: Configurar credenciales AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Login en Amazon ECR
      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Construir, etiquetar y subir la imagen a ECR
      - name: Build, Tag y Push de la imagen Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$PROJECT_NAME-repo:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$PROJECT_NAME-repo:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$PROJECT_NAME-repo:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -------------------------------------------------------
  # JOB 2: Desplegar en ECS Fargate (requiere aprobación manual)
  # -------------------------------------------------------
  deploy-to-production:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production  # <-- Requiere aprobación manual del reviewer

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Volver a autenticarse en AWS para este job
      - name: Configurar credenciales AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Descargar la task definition actual creada por Terraform
      - name: Descargar Task Definition desde ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition "$PROJECT_NAME-task" \
            --query 'taskDefinition' \
            --output json > task-definition.json

      # Actualizar la imagen en la task definition descargada
      - name: Actualizar imagen en el Task Definition de ECS
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.PROJECT_NAME }}-container
          image: ${{ needs.build-and-push.outputs.image }}

      # Desplegar la nueva revisión del task definition en ECS
      - name: Desplegar en Amazon ECS con Rolling Update
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.PROJECT_NAME }}-service
          cluster: ${{ env.PROJECT_NAME }}-cluster
          wait-for-service-stability: true  # Espera Zero Downtime
